<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autonomous AI Agents | Autonomous Work</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Larger, more comfortable filter buttons */
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center; /* center buttons */
      gap: 12px;               /* more space between buttons */
      margin-bottom: 28px;
    }

    .filter {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 10px 20px;   /* increased padding */
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 1rem;      /* slightly larger text */
    }

    .filter:hover,
    .filter.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    /* Keep section aligned like homepage */
    .discoveries-section {
      max-width: 1200px;
      margin: auto;
      padding: 60px 24px; /* balanced padding, not too wide */
    }
  </style>
</head>
<body>
  <!-- Futuristic Navbar -->
  <div class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <strong>Autonomous Work Space</strong>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="agents.html" class="active">Agents</a>
        <a href="tools.html">Tools</a>
        <a href="stack.html">Stack</a>
        <a href="workflows.html">Workflows</a>
      </div>
    </div>
  </div>

  <!-- Page Content Block -->
  <div class="discoveries-section">
    <div class="section-header">
      <h2><span>Autonomous</span> Agents</h2>
      <p>Agents built to perform tasks and workflows with greater autonomy.</p>
    </div>

    <div id="status" class="directory-status">Loading agents...</div>
    <div class="filters" id="filters"></div>
    <div class="discoveries-grid" id="items"></div>
  </div>

  <script>
    const WORKER_URL = "https://raspy-brook-525d.superagentic.workers.dev/";
    const ITEM_TYPE = "Agent";
    let allItems = [];
    let activeCategory = "All";

    function render(items) {
      const itemsEl = document.getElementById("items");

      if (!items.length) {
        itemsEl.innerHTML = '<div class="empty">No autonomous agents found.</div>';
        return;
      }

      itemsEl.innerHTML = items.map(item => `
        <div class="discovery-card">
          <div class="discovery-top">
            <span class="discovery-category">${item.Category || item.category || "Uncategorized"}</span>
            <span class="discovery-arrow">→</span>
          </div>
          <h3>${item.Name || item.name || "Untitled"}</h3>
          <p>${item.Description || item.description || ""}</p>
          <a href="${item.URL || item.url || '#'}" target="_blank" rel="noopener noreferrer">Visit</a>
        </div>
      `).join("");
    }

    function renderFilters(items) {
      const filtersEl = document.getElementById("filters");
      const categories = [...new Set(
        items.map(item => item.Category || item.category || "Uncategorized")
      )].sort();

      filtersEl.innerHTML = ["All", ...categories].map(category => `
        <button class="filter ${category === activeCategory ? "active" : ""}" data-category="${category}">
          ${category}
        </button>
      `).join("");

      filtersEl.querySelectorAll(".filter").forEach(button => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;

          filtersEl.querySelectorAll(".filter").forEach(btn =>
            btn.classList.toggle("active", btn === button)
          );

          const filtered = activeCategory === "All"
            ? allItems
            : allItems.filter(item =>
                (item.Category || item.category || "Uncategorized") === activeCategory
              );

          render(filtered);
        });
      });
    }

    async function loadItems() {
      const statusEl = document.getElementById("status");

      try {
        const res = await fetch(WORKER_URL);
        if (!res.ok) throw new Error("Network response was not ok");

        const data = await res.json();

        allItems = Array.isArray(data)
          ? data.filter(item => (item.Type || item.type || "") === ITEM_TYPE)
          : [];

        statusEl.textContent = `${allItems.length} agents`;

        renderFilters(allItems);
        render(allItems);
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Unable to load this directory right now.";
        document.getElementById("items").innerHTML =
          '<div class="empty">Please try again later.</div>';
      }
    }

    loadItems();
  </script>
</body>
</html>
