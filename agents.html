<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Agents Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background: #333;
      color: #fff;
    }
    tr:nth-child(even) {
      background: #f2f2f2;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>AI Agents Directory</h1>
  <table id="directory">
    <thead>
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Description</th>
        <th>URL</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be injected here -->
    </tbody>
  </table>

  <script>
    async function loadDirectory() {
      const res = await fetch("https://raspy-brook-525d.superagentic.workers.dev/"); // replace with your Worker URL
      const data = await res.json();
      const tbody = document.querySelector("#directory tbody");

      tbody.innerHTML = "";

      data.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.Name || ""}</td>
          <td>${item.Category || ""}</td>
          <td>${item.Description || ""}</td>
          <td><a href="${item.URL}" target="_blank">${item.URL || ""}</a></td>
        `;
        tbody.appendChild(row);
      });
    }

    loadDirectory();
  </script>
</body>
</html>
